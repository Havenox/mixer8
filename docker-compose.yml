version: '3.8'

services:
  # =========================================================================
  # 1. MICROSERVIÇO: Moises Extractor (.NET 10 - Headless Bot)
  # =========================================================================
  moises-extractor:
    image: mixer8-moises-extractor:latest
    build:
      context: ./moises-extractor
      dockerfile: Dockerfile
    container_name: mixer8_moises_extractor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOTNET_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      # Volume para persistir os downloads dos ZIPs na VPS
      - ${MOISES_DOWNLOADS_DIR:-./moises-extractor/downloads}:/app/downloads
      # Volume para persistir os cookies e sessão do navegador (auth.json)
      - ${MOISES_CONFIG_DIR:-./moises-extractor/config}:/app/config
    # Opcional: Se expusermos uma fila ou endpoint simples para o extractor receber comandos
    ports:
      - "${MOISES_EXTRACTOR_PORT:-5010}:5010"

