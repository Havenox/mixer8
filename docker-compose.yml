services:
  # =========================================================================
  # 1. MICROSERVIÇO: Extrator de Stems (mixer8-extractor - .NET 10 Headless Bot)
  # =========================================================================
  mixer8-extractor:
    image: mixer8-extractor:latest
    build:
      context: ./mixer8-extractor
      dockerfile: Dockerfile
    container_name: mixer8_extractor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOTNET_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - EXTRACTOR_DOWNLOADS_DIR=/app/downloads
      - API_URL=http://api:5000
    volumes:
      # Volume para persistir os downloads dos ZIPs na VPS/Host
      - ${EXTRACTOR_DOWNLOADS_DIR:-./mixer8-extractor/downloads}:/app/downloads
      # Volume para persistir os cookies e sessão do navegador (auth.json)
      - ${EXTRACTOR_CONFIG_DIR:-./mixer8-extractor/config}:/app/config
    ports:
      - "${EXTRACTOR_PORT:-5010}:5010"

  # =========================================================================
  # 2. MICROSERVIÇO: Banco de Dados (PostgreSQL) - Externo (Comentado)
  # =========================================================================
  # db:
  #   image: postgres:15-alpine
  #   container_name: mixer8_postgres_db
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     POSTGRES_DB: ${DB_NAME:-mixer8_db}
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-sua_senha_secreta_db}
  #   ports:
  #     - "${DB_PORT:-5432}:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # =========================================================================
  # 3. BACKEND API: mixer8-api (.NET Core / Node.js)
  # =========================================================================
  api:
    image: mixer8-api:latest
    build:
      context: ./mixer8-api
      dockerfile: Dockerfile
    container_name: mixer8_api
    restart: unless-stopped
    depends_on:
      - mixer8-extractor
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - EXTRACTOR_DOWNLOADS_DIR=/app/downloads
    volumes:
      # Shared volume de downloads para persistir arquivos originais/ZIPs temporários
      - ${EXTRACTOR_DOWNLOADS_DIR:-./mixer8-extractor/downloads}:/app/downloads
      # Mapeamento físico para todo o wwwroot (stems, playlists, profiles, etc.)
      - ./mixer8-api/wwwroot:/app/wwwroot
    ports:
      - "${API_PORT:-5000}:5000"

  # =========================================================================
  # 4. FRONTEND WEB: mixer8-app (React + Vite + Nginx)
  # =========================================================================
  app:
    image: mixer8-app:latest
    build:
      context: ./mixer8-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: mixer8_app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

