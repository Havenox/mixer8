server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Garante que index.html nunca seja armazenado em cache para forçar a atualização imediata dos bundles Vite
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Intercepta requisições de crawlers/bots nas rotas de playlists para carregar tags Open Graph dinâmicas
    location ~* ^/playlists/([^/]+)/?$ {
        root /usr/share/nginx/html;

        if ($http_user_agent ~* (facebookexternalhit|twitterbot|whatsapp|telegrambot|slackbot|discordbot|googlebot|bingbot|baiduspider|yandexbot)) {
            rewrite ^/playlists/([^/]+)/?$ /api/seo/playlists/$1 last;
        }

        try_files $uri $uri/ /index.html;
    }

    # Bloco interno seguro para realizar o proxy reverso do crawler para a API
    location /api/seo/ {
        internal;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para arquivos estáticos de stems e capas armazenados no wwwroot do container da API
    location ~* ^/(stems|playlists)/.+\.(?:webp|png|jpg|jpeg|gif|ico|opus|mp3|wav)$ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desativa cache HTTP em memória/disco do navegador para o motor AudioWorklet e WASM
    location /wasm/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Configuração opcional para headers de cache em arquivos estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|opus)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
