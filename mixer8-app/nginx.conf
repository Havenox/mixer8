server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Intercepta requisições de crawlers/bots nas rotas de playlists para carregar tags Open Graph dinâmicas
    location ~* ^/playlists/([^/]+)/?$ {
        root /usr/share/nginx/html;

        if ($http_user_agent ~* (facebookexternalhit|twitterbot|whatsapp|telegrambot|slackbot|discordbot|googlebot|bingbot|baiduspider|yandexbot)) {
            proxy_pass http://api:5000/api/seo/playlists/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }

        try_files $uri $uri/ /index.html;
    }

    # Configuração opcional para headers de cache em arquivos estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|opus)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
